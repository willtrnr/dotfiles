---
# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
logLevel: info

captureBuffer: 4

helpagent:
  disable: true

startPort: 13434

globalTTL: 1800


macros:
  model: ${MODEL_ID}
  quant: Q4_K_M

  log-level: 3

  threads: 4
  threads-batch: ${threads}

  fit-target: 768

  cache-ram: 2048

  ctx-1b: ${env.LLAMA_CTX_1B}
  ctx-4b: ${env.LLAMA_CTX_4B}
  ctx-9b: ${env.LLAMA_CTX_9B}
  ctx-12b: ${env.LLAMA_CTX_12B}
  ctx-27b: ${env.LLAMA_CTX_27B}
  ctx-33b: ${env.LLAMA_CTX_33B}

  ctx: ${ctx-33b}
  max-tokens: 16384

  checkpoints: 4
  checkpoint-step: 8192

  temp: 0.6

  llama-server-bin: /usr/bin/llama-server

  llama-server: >-
    ${llama-server-bin}
    --threads ${threads}
    --threads-batch ${threads-batch}
    --ctx-size ${ctx}
    --flash-attn on
    --load-mode none
    --moe-cache soft
    --fit on
    --fit-target ${fit-target}
    --fit-ctx ${ctx}
    --log-verbosity ${log-level}
    --cache-ram ${cache-ram}
    --no-cont-batching
    --no-mmproj
    --host 127.0.0.1
    --port ${PORT}
    --reuse-port
    --cors-origins localhost
    --no-ui
    --metrics
    --threads-http 2
    --jinja

  llama-server-hf: >-
    ${llama-server}
    --hf-repo ${model}:${quant}

  llama-server-hf-gguf: >-
    ${llama-server}
    --hf-repo ${model}-GGUF:${quant}

  kv-cache-stock: --cache-type-k q8_0 --cache-type-v q4_0
  kv-cache-turbo: --cache-type-k q8_0 --cache-type-v turbo3
  kv-cache-embedding: --cache-type-k f16 --cache-type-v f16

  gpu-only: >-
    --n-gpu-layers all
    --parallel 1

  cpu-only: >-
    --n-gpu-layers 0
    --parallel ${threads}

  mtp-ngram: >-
    --spec-type draft-mtp
    --spec-draft-n-max 2

  checkpointing: >-
    --ctx-checkpoints ${checkpoints}
    --checkpoint-min-step ${checkpoint-step}

  common: >-
    ${kv-cache-turbo}
    ${checkpointing}
    --batch-size 1024
    --ubatch-size 512
    --n-predict ${max-tokens}
    --temperature ${temp}
    --top-p 0.95
    --min-p 0.0
    --repeat-penalty 1.0
    --presence-penalty 0.0
    --reasoning on

  gemma-common: >-
    ${common}
    --top-k 64

  laguna-common: >-
    ${common}
    --top-k 20
    --reasoning-preserve

  nemotron-common: >-
    ${common}
    --top-k 20
    --reasoning-preserve

  qwen38-common: >-
    ${common}
    --top-k 20

models:
  .unused:
    cmd: /usr/bin/false ${PORT}
    unlisted: true
    filters: &filters
      stripParams: "top_k,top_p,min_p"
    metadata: &metadata
      temperature: "${temp}"
      max_tokens: "${max-tokens}"
      reasoning: true
      kilo:
        limit:
          context: "${ctx}"
          output: "${max-tokens}"

  DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP:
    cmd: >-
      ${llama-server-hf-gguf}
      --hf-file Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-LOW-MTP-${quant}.gguf
      ${qwen38-common}
    macros:
      quant: IQ4_XS
      ctx: &ctx ${ctx-27b}
    filters: *filters
    metadata: *metadata
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: *ctx

  empero-ai/Qwen3.8-9B-Distill:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwen38-common}
      ${mtp-ngram}
    macros:
      ctx: &ctx ${ctx-9b}
    filters: *filters
    metadata: *metadata
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: *ctx

  google/gemma-4-12B-it:
    cmd: >-
      ${llama-server-hf}
      ${gemma-common}
    macros:
      model: ${MODEL_ID}-qat-q4_0-gguf
      quant: Q4_0
      ctx: &ctx ${ctx-12b}
    filters: *filters
    metadata: *metadata
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: *ctx

  Jackrong/Qwopus3.8-27B-Coder-Flash:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwen38-common}
    macros:
      ctx: &ctx ${ctx-27b}
    filters: *filters
    metadata: *metadata
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: *ctx

  nvidia/NVIDIA-Nemotron-3-Nano-4B:
    cmd: >-
      ${llama-server-hf-gguf}
      ${nemotron-common}
    macros:
      ctx: &ctx ${ctx-4b}
    filters: *filters
    metadata: *metadata
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: *ctx

  poolside/Laguna-XS-2.1:
    cmd: >-
      ${llama-server-hf-gguf}
      ${laguna-common}
    macros:
      ctx: &ctx ${ctx-33b}
    filters: *filters
    metadata: *metadata
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: *ctx

routing:
  router:
    use: group

    settings:
      groups:
        agent:
          swap: true
          exclusive: false
          members:
            - DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP
            - empero-ai/Qwen3.8-9B-Distill
            - google/gemma-4-12B-it
            - Jackrong/Qwopus3.8-27B-Coder-Flash
            - poolside/Laguna-XS-2.1

  scheduler:
    use: fifo
