---
# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
startPort: 13434

globalTTL: 1800

sendLoadingState: true

captureBuffer: 4

macros:
  model: ${MODEL_ID}
  quant: Q4_K_M

  llama-server-bin: /usr/bin/llama-server

  llama-server: >-
    ${llama-server-bin}
    --threads 2
    --flash-attn on
    --load-mode dio
    --fit on
    --parallel 1
    --no-cont-batching
    --no-mmproj
    --host 127.0.0.1
    --port ${PORT}
    --reuse-port
    --cors-origins localhost
    --no-ui
    --metrics
    --threads-http 2
    --jinja

  llama-server-hf: >-
    ${llama-server}
    --hf-repo ${model}:${quant}

  llama-server-hf-gguf: >-
    ${llama-server}
    --hf-repo ${model}-GGUF:${quant}

  ram-cache-none: --cache-ram 0
  ram-cache-small: --cache-ram 1024
  ram-cache-medium: --cache-ram 4096
  ram-cache-large: --cache-ram 8192

  kv-cache-stock: --cache-type-k q8_0 --cache-type-v q4_0
  kv-cache-turbo: --cache-type-k q8_0 --cache-type-v turbo3

  gpu-only: --n-gpu-layers all

  ctx: 131072
  max-tokens: 16384

  temp: 0.6

  mtp-ngram: >-
    --spec-type draft-mtp,ngram-mod
    --spec-draft-n-max 2
    --spec-draft-p-min 0.8
    --spec-default

  qwen35-base: >-
    ${kv-cache-turbo}
    --ctx-size ${ctx}
    --batch-size 1024
    --ubatch-size 512
    --n-predict ${max-tokens}
    --temperature ${temp}
    --top-k 20
    --top-p 0.95
    --min-p 0.0
    --repeat-penalty 1.0
    --presence-penalty 0.0
    --ctx-checkpoints 3
    --checkpoint-min-step 32768
    --reasoning on

  qwen38-base: >-
    ${kv-cache-turbo}
    --ctx-size ${ctx}
    --batch-size 1024
    --ubatch-size 512
    --n-predict ${max-tokens}
    --temperature ${temp}
    --top-k 20
    --top-p 0.95
    --min-p 0.0
    --repeat-penalty 1.0
    --presence-penalty 0.0
    --ctx-checkpoints 3
    --checkpoint-min-step 32768
    --reasoning on

  qwen35-common: >-
    ${qwen35-base}
    ${ram-cache-large}
    ${gpu-only}
    ${mtp-ngram}

  qwen38-common: >-
    ${qwen38-base}
    ${ram-cache-large}
    ${gpu-only}
    ${mtp-ngram}

  qwythos-common: >-
    ${qwen35-base}
    ${ram-cache-large}
    ${gpu-only}

  qwopus-common: >-
    ${qwen35-base}
    ${ram-cache-large}
    ${gpu-only}
    --rope-scaling yarn
    --rope-scale 4
    --yarn-orig-ctx 32768

  ornith-common: >-
    ${qwen35-base}
    ${ram-cache-large}
    ${gpu-only}

  nomic-common: >-
    ${ram-cache-small}
    --log-verbosity 2
    --ctx-checkpoints 0
    --embeddings

models:
  .unused:
    cmd: /usr/bin/false ${PORT}
    unlisted: true
    filters: &filters
      stripParams: "temperature,top_k,top_p,min_p"
      setParams:
        reasoningEffort?: medium
    metadata: &metadata
      temperature: "${temp}"
      max_tokens: "${max-tokens}"
      reasoning: true
      kilo:
        limit:
          context: "${ctx}"
          output: "${max-tokens}"
        variants:
          none:
            reasoningEffort: none
          minimal:
            reasoningEffort: minimal
          low:
            reasoningEffort: low
          medium:
            reasoningEffort: medium
          high:
            reasoningEffort: high
          xhigh:
            reasoningEffort: xhigh

  DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwen38-common}
      --hf-file Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-LOW-MTP-${quant}.gguf
    macros:
      quant: IQ4_XS
      ctx: &ctx 131072
    filters: *filters
    metadata: *metadata
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: *ctx

  Jackrong/Qwopus3.5-9B-Coder:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwopus-common}
    macros:
      ctx: &ctx 131072
    filters: *filters
    metadata: *metadata
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: *ctx

  empero-ai/Qwythos-9B-v2:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwythos-common}
      ${mtp-ngram}
    macros:
      ctx: &ctx 196608
    filters: *filters
    metadata: *metadata
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: *ctx

  empero-ai/Qwen3.8-9B-Distill:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwen38-common}
    macros:
      ctx: &ctx 196608
    filters: *filters
    metadata: *metadata
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: *ctx

  empero-ai/Qwythos-27B-v1:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwythos-common}
    macros:
      ctx: &ctx 131072
    filters: *filters
    metadata: *metadata
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: *ctx

  ornith-ai/Ornith-1.5-9B:
    cmd: >-
      ${llama-server-hf-gguf}
      ${ornith-common}
    macros:
      ctx: &ctx 196608
    filters: *filters
    metadata: *metadata
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: *ctx

  nomic-ai/nomic-embed-text-v1.5:
    cmd: >-
      ${llama-server-hf-gguf}
      ${nomic-common}
      --ctx-size 8192
      --batch-size 8192
      --ubatch-size 8192
      --rope-scaling yarn
      --rope-freq-scale 0.75
    macros:
      quant: Q8_0
    ttl: 300
    filters: *filters
    metadata:
      embedding: true
      kilo:
        dimension: 768
    capabilities:
      context: 8192

routing:
  router:
    use: group

    settings:
      groups:
        agent:
          swap: true
          exclusive: false
          members:
            - DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP
            - Jackrong/Qwopus3.5-9B-Coder
            - empero-ai/Qwen3.8-9B-Distill
            - empero-ai/Qwythos-27B-v1
            - empero-ai/Qwythos-9B-v2
            - ornith-ai/Ornith-1.5-9B

        embed:
          swap: true
          exclusive: false
          members:
            - nomic-ai/nomic-embed-text-v1.5

  scheduler:
    use: fifo

    settings:
      fifo:
        priority:
          nomic-ai/nomic-embed-text-v1.5: -10
