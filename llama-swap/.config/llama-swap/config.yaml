---
# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

captureBuffer: 0

startPort: 13434

globalTTL: 1800

macros:
  model: ${MODEL_ID}
  quant: Q4_K_M

  llama-server-bin: /usr/bin/llama-server

  llama-server: >-
    ${llama-server-bin}
    --threads 2
    --flash-attn on
    --direct-io
    --fit on
    --parallel 1
    --no-cont-batching
    --host 127.0.0.1
    --port ${PORT}
    --reuse-port
    --no-ui
    --threads-http 2
    --jinja

  llama-server-hf: >-
    ${llama-server}
    --hf-repo ${model}:${quant}

  llama-server-hf-gguf: >-
    ${llama-server}
    --hf-repo ${model}-GGUF:${quant}

  ram-cache-none: --cache-ram 0
  ram-cache-small: --cache-ram 1024
  ram-cache-medium: --cache-ram 4096
  ram-cache-large: --cache-ram 8192

  kv-cache-stock: --cache-type-k q8_0 --cache-type-v q4_0
  kv-cache-turbo: --cache-type-k q8_0 --cache-type-v turbo3

  gpu-only: --n-gpu-layers all

  reasoning: >-
    --reasoning on
    --reasoning-budget 2048
    --reasoning-budget-message "... thinking budget exceeded, let's answer now."

  mtp-ngram: >-
    --spec-type draft-mtp,ngram-mod
    --spec-draft-n-max 2
    --spec-draft-p-min 0.8
    --spec-default

  qwen35-common: >-
    ${kv-cache-turbo}
    ${reasoning}
    --batch-size 1024
    --ubatch-size 512
    --n-predict 16384
    --repeat-penalty 1.05
    --top-k 20
    --top-p 0.95
    --no-mmproj
    --ctx-checkpoints 3
    --checkpoint-min-step 32768

  qwythos-common: >-
    ${qwen35-common}
    ${ram-cache-large}
    ${gpu-only}
    --temperature 0.6

  qwopus-common: >-
    ${qwen35-common}
    ${ram-cache-large}
    ${gpu-only}
    --ctx-size 131072
    --rope-scaling yarn
    --rope-scale 4
    --yarn-orig-ctx 32768
    --temperature 0.6

  nomic-common: >-
    ${ram-cache-small}
    --log-verbosity 2
    --ctx-checkpoints 0
    --embeddings

models:
  empero-ai/Qwythos-9B-v2:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwythos-common}
      ${mtp-ngram}
      --ctx-size 196608
    aliases:
      - Qwythos-9B-v2
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 196608

  empero-ai/Qwythos-27B-v1:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwythos-common}
      --ctx-size 131072
    aliases:
      - Qwythos-27B-v1
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 131072

  empero-ai/Qwen3.8-9B-Distill:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwen35-common}
      ${ram-cache-large}
      ${gpu-only}
      ${mtp-ngram}
      --temperature 0.6
      --ctx-size 196608
    aliases:
      - Qwen3.8-9B-Distill
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 196608

  Jackrong/Qwopus3.5-9B-Coder:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwopus-common}
    aliases:
      - Qwopus3.5-9B-Coder
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 131072

  Jackrong/Qwopus3.5-4B-Coder:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwen35-common}
      ${ram-cache-small}
      --temperature 0.6
      --ctx-size 32768
    aliases:
      - Qwopus3.5-4B-Coder
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 32768

  nomic-ai/nomic-embed-text-v1.5:
    cmd: >-
      ${llama-server-hf-gguf}
      ${nomic-common}
      --ctx-size 8192
      --batch-size 8192
      --ubatch-size 8192
      --rope-scaling yarn
      --rope-freq-scale 0.75
    macros:
      quant: Q8_0
    ttl: 300
    aliases:
      - nomic-embed-text-v1.5
    capabilities:
      context: 8192

routing:
  router:
    use: matrix

    settings:
      matrix:
        vars:
          qw92: empero-ai/Qwythos-9B-v2
          qw271: empero-ai/Qwythos-27B-v1
          qw389d: empero-ai/Qwen3.8-9B-Distill
          qo359: Jackrong/Qwopus3.5-9B-Coder
          qo354: Jackrong/Qwopus3.5-4B-Coder

          ne15: nomic-ai/nomic-embed-text-v1.5

        evict_costs:
          qw92: 20
          qw271: 30
          qw389d: 20
          qo359: 20
          qo354: 15

          ne15: 10

        sets:
          standard: (+agent) & (+embed)

          agent: qw92 | qw271 | qw389d | qo359 | qo354
          embed: ne15

  scheduler:
    use: fifo

    settings:
      fifo:
        priority:
          empero-ai/Qwythos-9B-v2: 20
          empero-ai/Qwythos-27B-v1: 20
          empero-ai/Qwen3.8-9B-Distill: 20
          Jackrong/Qwopus3.5-9B-Coder: 20
          Jackrong/Qwopus3.5-4B-Coder: 20
          nomic-ai/nomic-embed-text-v1.5: 10
