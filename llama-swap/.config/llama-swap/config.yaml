---
# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

captureBuffer: 0

startPort: 13434

globalTTL: 1800

macros:
  model: ${MODEL_ID}
  quant: Q4_K_M

  llama-server-bin: /usr/bin/llama-server

  llama-server: >-
    ${llama-server-bin}
    --threads 2
    --flash-attn on
    --load-mode dio
    --fit on
    --parallel 1
    --no-cont-batching
    --host 127.0.0.1
    --port ${PORT}
    --reuse-port
    --cors-origins localhost
    --no-ui
    --metrics
    --threads-http 2
    --jinja

  llama-server-hf: >-
    ${llama-server}
    --hf-repo ${model}:${quant}

  llama-server-hf-gguf: >-
    ${llama-server}
    --hf-repo ${model}-GGUF:${quant}

  ram-cache-none: --cache-ram 0
  ram-cache-small: --cache-ram 1024
  ram-cache-medium: --cache-ram 4096
  ram-cache-large: --cache-ram 8192

  kv-cache-stock: --cache-type-k q8_0 --cache-type-v q4_0
  kv-cache-turbo: --cache-type-k q8_0 --cache-type-v turbo3

  gpu-only: --n-gpu-layers all

  reasoning: >-
    --reasoning on
    --reasoning-budget 2048
    --reasoning-budget-message "... thinking budget exceeded, let's answer now."

  mtp-ngram: >-
    --spec-type draft-mtp,ngram-mod
    --spec-draft-n-max 2
    --spec-draft-p-min 0.8
    --spec-default

  qwen35-base: >-
    ${kv-cache-turbo}
    ${reasoning}
    --batch-size 1024
    --ubatch-size 512
    --n-predict 16384
    --repeat-penalty 1.05
    --top-k 20
    --top-p 0.95
    --no-mmproj
    --ctx-checkpoints 3
    --checkpoint-min-step 32768

  qwen35-common: >-
    ${qwen35-base}
    ${ram-cache-large}
    ${gpu-only}
    ${mtp-ngram}
    --temperature 0.6

  qwen38-base: >-
    ${kv-cache-turbo}
    ${reasoning}
    --batch-size 1024
    --ubatch-size 512
    --n-predict 16384
    --repeat-penalty 1.05
    --top-k 20
    --top-p 0.95
    --no-mmproj
    --ctx-checkpoints 3
    --checkpoint-min-step 32768

  qwen38-common: >-
    ${qwen38-base}
    ${ram-cache-large}
    ${gpu-only}
    ${mtp-ngram}
    --temperature 0.6

  qwythos-common: >-
    ${qwen35-base}
    ${ram-cache-large}
    ${gpu-only}
    --temperature 0.6

  qwopus-common: >-
    ${qwen35-base}
    ${ram-cache-large}
    ${gpu-only}
    --rope-scaling yarn
    --rope-scale 4
    --yarn-orig-ctx 32768
    --temperature 0.6

  ornith-common: >-
    ${qwen35-base}
    ${ram-cache-large}
    ${gpu-only}
    --temperature 0.6

  nomic-common: >-
    ${ram-cache-small}
    --log-verbosity 2
    --ctx-checkpoints 0
    --embeddings

models:
  empero-ai/Qwythos-9B-v2:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwythos-common}
      ${mtp-ngram}
      --ctx-size 196608
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 196608

  empero-ai/Qwythos-27B-v1:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwythos-common}
      --ctx-size 131072
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 131072

  empero-ai/Qwen3.8-9B-Distill:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwen38-common}
      --ctx-size 196608
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 196608

  Jackrong/Qwopus3.5-9B-Coder:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwopus-common}
      --ctx-size 131072
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 131072

  JonathanColetti/Qwen3.8-27B-Uncensored:
    cmd: >-
      ${llama-server-hf-gguf}
      ${qwen38-common}
      --ctx-size 131072
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 131072

  ornith-ai/Ornith-1.5-9B:
    cmd: >-
      ${llama-server-hf-gguf}
      ${ornith-common}
      --ctx-size 196608
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 196608

  nomic-ai/nomic-embed-text-v1.5:
    cmd: >-
      ${llama-server-hf-gguf}
      ${nomic-common}
      --ctx-size 8192
      --batch-size 8192
      --ubatch-size 8192
      --rope-scaling yarn
      --rope-freq-scale 0.75
    macros:
      quant: Q8_0
    ttl: 300
    capabilities:
      context: 8192

routing:
  router:
    use: group

    settings:
      groups:
        agent:
          swap: true
          exclusive: false
          members:
            - empero-ai/Qwythos-9B-v2
            - empero-ai/Qwythos-27B-v1
            - empero-ai/Qwen3.8-9B-Distill
            - Jackrong/Qwopus3.5-9B-Coder
            - JonathanColetti/Qwen3.8-27B-Uncensored
            - ornith-ai/Ornith-1.5-9B

        embed:
          swap: true
          exclusive: false
          members:
            - nomic-ai/nomic-embed-text-v1.5

  scheduler:
    use: fifo

    settings:
      fifo:
        priority:
          nomic-ai/nomic-embed-text-v1.5: -10
